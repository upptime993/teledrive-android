name: Build & Release APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode Keystore
        if: secrets.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          echo "KEYSTORE_PATH=${{ github.workspace }}/keystore.jks" >> $GITHUB_ENV

      - name: Build Release APK
        env:
          TELEDRIVE_BASE_URL: ${{ secrets.TELEDRIVE_BASE_URL }}
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Get version info
        id: version
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=v${{ github.event.inputs.version_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeleDrive-Sky-release-${{ steps.version.outputs.VERSION }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: TeleDrive Sky ${{ steps.version.outputs.VERSION }}
          tag_name: ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
          body: |
            ## 📱 TeleDrive Sky ${{ steps.version.outputs.VERSION }}

            Cloud storage berbasis Telegram di genggaman Anda.

            ### 📥 Download
            Download APK dari Assets di bawah ini.

            ### ✨ Fitur
            - File Explorer lengkap dengan hierarki folder
            - Upload/Download dengan background service
            - Preview gambar, video, PDF
            - Pencarian file
            - Favorit & Trash management
            - Share link management
            - Biometric/PIN lock
            - Offline cache
            - Material You design dengan animasi premium

            ### 📋 Requirement
            - Android 11 (API 30) atau lebih baru
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
